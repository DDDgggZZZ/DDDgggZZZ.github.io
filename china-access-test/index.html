<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fc">
  <meta name="description" content="一个不依赖外部资源的 GitHub Pages 中国大陆网络访问测试页面。">
  <title>GitHub Pages · 访问测试</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: radial-gradient(ellipse at 20% 10%, #ddeaff 0%, transparent 42%), radial-gradient(ellipse at 90% 90%, #e8ddff 0%, transparent 40%), #f6f8fc; color: #17253b; padding: 24px; }
    main { width: min(100%, 570px); background: rgba(255,255,255,.94); border: 1px solid #e5eaf2; border-radius: 24px; padding: clamp(30px, 7vw, 52px); box-shadow: 0 20px 75px rgba(35, 58, 91, .09); }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: #47618a; font-size: 13px; font-weight: 700; letter-spacing: .07em; }
    .eyebrow::before { content: ""; background: #31b27a; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 4px #def8eb; }
    h1 { font-size: clamp(30px, 7vw, 43px); line-height: 1.22; margin: 28px 0 16px; letter-spacing: -.03em; }
    .intro { font-size: 16px; line-height: 1.9; color: #536379; margin-bottom: 30px; }
    .status { display: flex; gap: 14px; align-items: flex-start; background: #eff9f4; border: 1px solid #d6efe0; border-radius: 14px; padding: 17px 18px; }
    .check { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; color: #fff; background: #169b61; font-weight: bold; }
    .status strong { display: block; color: #176e49; font-size: 16px; margin: 2px 0 4px; }
    .status span { display: block; font-size: 13px; line-height: 1.65; color: #4e7661; }
    dl { border-top: 1px solid #edf0f5; margin: 27px 0 0; padding-top: 19px; }
    dl div { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 18px; margin: 12px 0; font-size: 13px; }
    dt { color: #8c9aab; } dd { margin: 0; color: #546579; text-align: right; overflow-wrap: anywhere; }
    button { appearance: none; border: 0; width: 100%; margin-top: 24px; padding: 14px 18px; border-radius: 12px; cursor: pointer; background: #2e68cf; color: white; font: inherit; font-size: 15px; font-weight: 600; transition: background .2s; }
    button:hover { background: #2157b5; } button:focus-visible { outline: 3px solid #96b7f6; outline-offset: 3px; }
    footer { color: #98a4b4; text-align: center; font-size: 12px; line-height: 1.8; margin-top: 26px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">GITHUB PAGES · CONNECTION TEST</div>
    <h1>你好，网络世界 👋</h1>
    <p class="intro">这是一个部署在 GitHub Pages 上的小网站。如果你能正常看到这个页面，说明<strong>你当前使用的网络</strong>可以成功加载这个地址。</p>
    <section class="status" aria-live="polite">
      <div class="check" aria-hidden="true">✓</div>
      <div><strong>页面加载成功</strong><span>HTML 与内嵌样式已正常显示，不依赖任何第三方 CDN。</span></div>
    </section>
    <dl>
      <div><dt>网站域名</dt><dd id="host">dddgggzzz.github.io</dd></div>
      <div><dt>本地时间</dt><dd id="time">载入中…</dd></div>
      <div><dt>测试版本</dt><dd>2026-11-03 · v1.0</dd></div>
    </dl>
    <button id="copy" type="button">复制测试网址</button>
    <footer>建议关闭 VPN/代理，分别使用中国移动、电信、联通或校园网测试。<br>本页面不会检测或上传你的 IP 地址。</footer>
  </main>
  <script>
    document.getElementById("host").textContent = location.hostname;
    document.getElementById("time").textContent = new Date().toLocaleString("zh-CN", { hour12: false });
    document.getElementById("copy").addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(location.href);
        this.textContent = "已复制 ✓";
      } catch (_) {
        this.textContent = "请从地址栏复制网址";
      }
    });
  </script>
</body>
</html>
